[workspace]
resolver = "2"
members = [
    "crates/reforge-schema",
    "crates/reforge-output",
    "crates/reforge-engine",
    "crates/reforge-unity-engine",
    "tools/reforge",
    "tools/reforge-unity",
    "tools/reforge-workflow",
    "tools/reforge-calibrate",
]
default-members = [
    "tools/reforge",
]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/LyleMi/Reforge"
homepage = "https://lylemi.github.io/Reforge/"
readme = "README.md"
keywords = ["code-analysis", "refactoring", "static-analysis", "dataflow"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
hex = "0.4"
ignore = "0.4"
reforge-engine = { version = "0.3.1", path = "crates/reforge-engine" }
reforge-output = { version = "0.3.1", path = "crates/reforge-output" }
reforge-schema = { version = "0.3.1", path = "crates/reforge-schema" }
reforge-unity-engine = { version = "0.3.1", path = "crates/reforge-unity-engine" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.11"
toml = "1.1"
tree-sitter = "0.27.0"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-swift = "0.7.4"
tree-sitter-lua = "0.5.0"
tree-sitter-scala = "0.26.2"
tree-sitter-r = "1.3.0"
tree-sitter-html = "0.23.2"
tree-sitter-dart = "0.2.0"
tree-sitter-css = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-yaml = "0.7.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-sequel = "0.3.11"
tree-sitter-bash = "0.25.1"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-php = "0.24.2"
tree-sitter-powershell = "0.26.4"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
terminal_size = "0.4.4"

[workspace.lints.rust]
unsafe_code = "forbid"
