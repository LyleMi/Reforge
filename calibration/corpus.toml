[collection]
clone-command = "git clone --filter=blob:none https://github.com/{repository}.git && git checkout --detach {commit}"
codebase-command = "reforge analyze . --analysis codebase --output json --reproducible"
dataflow-command = "reforge analyze . --analysis dataflow --output json --reproducible"
