name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  calibration:
    name: calibration gate
    uses: ./.github/workflows/calibration.yml

  build:
    name: build (${{ matrix.os }})
    needs: calibration
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: reforge-linux-x86_64
            binary: reforge
          - os: windows-latest
            artifact: reforge-windows-x86_64
            binary: reforge.exe
          - os: macos-15-intel
            artifact: reforge-macos-x86_64
            binary: reforge
          - os: macos-15
            artifact: reforge-macos-aarch64
            binary: reforge

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Build core binary
        run: cargo build --locked --release -p reforge-cli

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/release/${{ matrix.binary }}" "dist/${{ matrix.binary }}"
          Copy-Item README.md dist/README.md
          Copy-Item LICENSE dist/LICENSE
          New-Item -ItemType Directory -Force "dist/skills/reforge-analyze" | Out-Null
          Copy-Item "skills/reforge-analyze/SKILL.md" "dist/skills/reforge-analyze/SKILL.md"
          if (Test-Path "skills/reforge-analyze/agents") {
            Copy-Item "skills/reforge-analyze/agents" "dist/skills/reforge-analyze/agents" -Recurse
          }
          if ("${{ runner.os }}" -eq "Windows") {
            Compress-Archive -Path dist/* -DestinationPath "${{ matrix.artifact }}.zip" -Force
          } else {
            tar -czf "${{ matrix.artifact }}.tar.gz" -C dist .
          }

      - name: Smoke test packaged binary
        shell: pwsh
        run: |
          $version = (& "target/release/${{ matrix.binary }}" --version | Out-String).Trim()
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $packageVersion = ($metadata.packages | Where-Object name -eq "reforge-cli").version
          if ($version -ne "reforge $packageVersion") {
            throw "unexpected packaged version: $version"
          }
          if (-not (Test-Path "dist/skills/reforge-analyze/SKILL.md")) {
            throw "core skill is missing from the release artifact"
          }
          if (-not (Test-Path "dist/README.md") -or -not (Test-Path "dist/LICENSE")) {
            throw "release documentation is missing"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: ignore

  publish:
    name: publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: reforge-*
          path: artifacts
          merge-multiple: true

      - name: Generate SHA-256 manifest
        working-directory: artifacts
        run: sha256sum reforge-* | sort -k2 > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          body_path: .github/release-notes-${{ github.ref_name }}.md
          fail_on_unmatched_files: true
