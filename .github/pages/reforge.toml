version = 2

[analysis]
enabled = ["codebase"]

[scope]
exclude-tests = true
ignore-paths = [
  "assets/report-app.js",
  "crates/reforge-output/assets/report-app.js",
  "web/report-app/src/vite-env.d.ts",
  "tools/reforge-workflow",
  "crates/reforge-unity-engine",
  "tools/reforge-unity",
]

[rules]
enable = [
  "reforge.codebase.large_file",
  "reforge.codebase.long_function",
  "reforge.codebase.complex_function",
  "reforge.codebase.similar_functions",
  "reforge.codebase.large_public_surface",
]

[codebase]
churn = "off"
max-file-lines = 475
max-function-lines = 75
max-function-complexity = 14
max-public-items = 25
function-similarity = 0.90
min-similar-functions = 2
min-function-tokens = 100
